;border:1px solid var(--bd);border-radius:8px;overflow:hidden;font-size:13px}.bh{background:var(--gb);color:#fff;font-weight:700;text-align:center;padding:7px 4px;border-bottom:3px solid var(--ac)}.bgp{padding:6px 8px;border-top:1px solid var(--bd)}.bl{display:flex;justify-content:space-between;gap:6px;padding:3px 0}.bl span:first-child{min-width:0;word-break:break-word}.bl span:last-child{white-space:nowrap}.bgp .s{margin-top:4px;padding:3px 8px;font-size:12px}.btot{background:var(--go);color:#101828;border-radius:8px;padding:8px;font-weight:700;display:flex;flex-direction:column;font-size:12px}.btot b{font:700 18px "Barlow Condensed","Arial Narrow",sans-serif}.bchk{text-align:center;font-weight:700;padding:10px;border-radius:8px;border:2px solid currentColor;margin:6px 0}.pn button:disabled{opacity:.3;cursor:default}@media (max-width:480px){header h1{font-size:18px}#lg{width:36px;height:36px}}@media (max-width:480px){header .in{flex-wrap:wrap}header .bt{flex:0 0 100%}header .bt button{flex:1}}header small{display:block;color:#cfe0f5;font-size:14px}header .s{color:#fff;border-color:#ffffff66}

.ck input[type=radio]{padding:0;width:20px;height:20px;flex:none}.ln{display:grid;grid-template-columns:1fr 1fr 1fr 34px;gap:6px;margin-top:8px}.ln input{margin:0;padding:9px 6px}.ln .nm{grid-column:1/-1}.cm{font-size:13px;margin:2px 0 0}.dr{display:flex;gap:8px;align-items:baseline;padding:4px 0;border-top:1px solid var(--bd)}.dr span{flex:1;min-width:0;word-break:break-word}.dr .dc{flex:0 0 42px;text-align:center}.dr b:last-child{white-space:nowrap}.dr2{display:flex;gap:8px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--bd)}.dr2 .dc{flex:0 0 38px;text-align:center;background:var(--bd);border-radius:6px;padding:2px 0}.dr2 .mn{flex:1;min-width:0}.dr2 .am{flex:0 0 auto;display:flex;flex-direction:column;align-items:flex-end;font-size:12.5px;white-space:nowrap}.pb{height:6px;border-radius:3px;background:var(--bd);margin:4px 0 2px;overflow:hidden}.pb i{display:block;height:100%;background:var(--gl)}.chip{display:inline-block;background:var(--gl);color:#14233a;border-radius:10px;padding:1px 8px;font-size:12px;margin:3px 4px 0 0}.dr .ao{flex:0 0 auto;white-space:nowrap;font-size:12px;color:var(--mu);min-width:76px;text-align:right}.dn{color:var(--ok)}.up{color:var(--bad)}.seg{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.seg button{flex:1 0 28%;font-size:13px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:6px;padding:9px 4px;font-weight:600}.seg button.on{background:var(--gb);color:#fff;border-color:transparent}.tbw{overflow-x:auto;margin:6px 0 14px}.tb{width:100%;border-collapse:collapse;font-size:14px}.tb th{background:var(--gb);color:#fff;padding:7px 8px;white-space:nowrap}.tb td{padding:7px 8px;border-bottom:1px solid var(--bd);white-space:nowrap}.tb tfoot td{font-weight:700;background:var(--go);color:#101828}.hero{display:flex;align-items:center;gap:12px;background:var(--gb);color:#fff;border-radius:14px;padding:14px;border-bottom:4px solid var(--lm);margin-top:6px}.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}.tile{border:0;border-radius:12px;padding:8px 10px;text-align:left;color:#fff;box-shadow:0 2px 6px rgba(0,0,0,.16);display:flex;flex-direction:row;align-items:center;gap:8px;min-width:0}.tile .ti{font-size:22px;flex:none}.tt{display:flex;flex-direction:column;min-width:0;line-height:1.15}.nodel button.bad,.nocfg #eb,.nocfg #rb,.noedit .ned{display:none!important}.tile.tc{grid-column:1/-1;justify-self:center;width:calc(50% - 4px);flex-direction:column;justify-content:center;text-align:center;gap:3px;padding:10px 12px}.tile.tc .ti{font-size:30px;line-height:1}.tile.tc .tt{align-items:center;max-width:100%}.tile.tc small{max-width:100%}.tile b{font:700 17px "Barlow Condensed","Arial Narrow",sans-serif}.tile small{opacity:.92;font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.t-gb{background:var(--gb)}.t-go{background:var(--go);color:#101828}.t-gl{background:var(--gl);color:#14233a}
.x{background:transparent;border:1px solid var(--bd);color:var(--bad);border-radius:6px;font-size:20px}
.ck{display:flex;gap:8px;align-items:center}.ck input{width:auto;margin:0}

.sheet{background:var(--card);width:100%;max-width:720px;max-height:92vh;overflow:auto;padding:14px 12px calc(14px + env(safe-area-inset-bottom,0px));border-radius:14px 14px 0 0}

/* ===== Capa de diseño: más aire, sombras suaves y la franja de la marca (azul 55% · naranja 40% · verde 5%) ===== */
*{scrollbar-width:thin;scrollbar-color:var(--bd) transparent}
body{-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
.r b,.sum b,.tot b,.tb td,.dr b,.bl span:last-child,.btot b,.tile b{font-variant-numeric:tabular-nums}
header{position:relative;border-bottom:0;box-shadow:0 6px 22px rgba(10,58,120,.26)}
header::after{content:"";position:absolute;left:0;right:0;bottom:-4px;height:4px;background:linear-gradient(90deg,#0d4f9f 0 55%,#f28a1e 55% 95%,#a6d82a 95% 100%)}
main{padding:10px 12px}
.card{border-radius:12px;border-left-width:4px;padding:12px 14px;margin:10px 0;box-shadow:0 1px 2px rgba(13,40,80,.05),0 6px 16px rgba(13,40,80,.06);transition:box-shadow .15s,transform .15s}
.card[onclick]{cursor:pointer}
@media (hover:hover){.card[onclick]:hover{box-shadow:0 2px 4px rgba(13,40,80,.08),0 10px 24px rgba(13,40,80,.12);transform:translateY(-1px)}}
.card[onclick]:active{transform:scale(.995)}
.add{border-radius:12px;box-shadow:0 6px 14px rgba(240,122,16,.3);transition:transform .1s,box-shadow .15s}
.add:active{transform:translateY(1px);box-shadow:0 2px 6px rgba(240,122,16,.3)}
.row button{border-radius:10px;box-shadow:0 4px 10px rgba(240,122,16,.25);transition:transform .1s}
.row button:active{transform:translateY(1px)}
.b2{box-shadow:none!important}
.s{border-radius:9px;background:var(--card);transition:background .12s,border-color .12s,transform .1s}
.s:active{transform:scale(.97)}
@media (hover:hover){.s:hover{border-color:var(--st)}}
header .s{background:transparent}
.tag{border-radius:999px;padding:1px 10px}
.chip{border-radius:999px}
input,textarea,select{border-radius:10px;transition:border-color .12s,box-shadow .12s}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--st);box-shadow:0 0 0 3px rgba(13,91,181,.2)}
button:focus-visible{outline:3px solid rgba(242,138,30,.55);outline-offset:2px}
.tile{border-radius:14px;padding:10px 12px;position:relative;overflow:hidden;box-shadow:0 6px 16px rgba(13,40,80,.2);transition:transform .12s,box-shadow .15s}
.tile::after{content:"";position:absolute;right:-20px;top:-20px;width:70px;height:70px;border-radius:50%;background:rgba(255,255,255,.13);pointer-events:none}
.tile>*{position:relative;z-index:1}
.tile .ti{display:grid;place-items:center;width:38px;height:38px;border-radius:12px;background:rgba(255,255,255,.22);font-size:21px;line-height:1}
.t-gl .ti{background:rgba(255,255,255,.4)}
.tile.tc .ti{width:50px;height:50px;border-radius:15px;font-size:28px}
.tile:active{transform:scale(.98)}
@media (hover:hover){.tile:hover{transform:translateY(-2px);box-shadow:0 10px 22px rgba(13,40,80,.26)}}
.hero{position:relative;overflow:hidden;border-radius:16px;box-shadow:0 8px 22px rgba(10,58,120,.28)}
.hero::before{content:"";position:absolute;right:-34px;top:-34px;width:140px;height:140px;border-radius:50%;background:rgba(255,255,255,.08);pointer-events:none}
.hero>*{position:relative;z-index:1}
.sum div{border-radius:12px;border-left:3px solid var(--ac);box-shadow:0 1px 2px rgba(13,40,80,.05),0 4px 12px rgba(13,40,80,.05)}
.seg button{border-radius:999px;padding:9px 8px;box-shadow:0 1px 2px rgba(13,40,80,.06);transition:background .12s,box-shadow .12s}
.seg button.on{box-shadow:0 5px 12px rgba(13,91,181,.3)}
.tbw{border-radius:12px;border:1px solid var(--bd)}
.tb tbody tr:nth-child(even) td{background:rgba(13,91,181,.05)}
.tb th:first-child{border-top-left-radius:11px}.tb th:last-child{border-top-right-radius:11px}
#m{backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.sheet{border-radius:20px 20px 0 0;box-shadow:0 -10px 30px rgba(0,0,0,.25);animation:sheetUp .2s ease-out}
.sheet::before{content:"";display:block;width:44px;height:4px;border-radius:2px;background:var(--bd);margin:-6px auto 10px}
.sheet h3{color:var(--st)}
@keyframes sheetUp{from{transform:translateY(28px);opacity:.4}to{transform:none;opacity:1}}
#toast{border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.28)}
#side{border-radius:0 18px 18px 0}
#sidelist button{padding:9px 10px;border-radius:10px;transition:background .12s}
@media (hover:hover){#sidelist button:hover{background:rgba(255,255,255,.12)}}
.bcol,.btot,.bchk{border-radius:12px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ===== Salir, pie del menú y vista de computadora ===== */
#side{display:flex;flex-direction:column}#sidelist{flex:1 0 auto}
.sf{border-top:1px solid rgba(255,255,255,.22);margin-top:10px;padding:10px 8px 2px;font-size:12.5px;line-height:1.55;color:#dbe7f6}.sf b{color:#fff;font-weight:600}
#xb{font-weight:600;background:rgba(255,255,255,.12);white-space:nowrap}
@media (max-width:480px){header .bt{gap:4px!important}header .bt .s{padding:6px 7px;font-size:13.5px}header .ico{min-width:0;padding:0 6px;font-size:14px}}
@media (hover:hover){#xb:hover{background:#b3261e;border-color:#b3261e}}
@media (min-width:1024px){
 :root{--sw:250px}
 body{padding-left:var(--sw)}
 #side{width:var(--sw);max-width:none;transform:none;border-radius:0;box-shadow:none;z-index:16;padding:16px 12px 14px}
 #side .sh{padding:4px 6px 14px}#side .sh img{width:44px;height:44px}#side .sh b{font-size:18px}
 #sidelist button{font-size:14.5px;padding:10px 12px}#sidelist button span{font-size:18px;width:24px}
 #scrim,.mb,#lg{display:none!important}
 header{position:sticky;top:0;z-index:15}
 header .in{max-width:1200px;padding:14px 32px;gap:14px}
 header h1{font-size:24px}header small{font-size:15px}
 header .bt{gap:8px!important}header .bt .s{padding:8px 14px;font-size:15px}
 .ico{flex:0 1 auto;line-height:34px;padding:0 14px}
 main{max-width:1200px;padding:20px 32px 40px}
 .hero{padding:20px 22px}
 .tiles{grid-template-columns:repeat(4,1fr);gap:14px;margin:16px 0}
 .tile{padding:14px 16px}.tile.tc{grid-column:auto;justify-self:stretch;width:auto;flex-direction:row;text-align:left;justify-content:flex-start;gap:8px}.tile.tc .tt{align-items:flex-start}
 .sum{grid-template-columns:repeat(4,1fr);gap:12px}
 .card{padding:14px 18px}
 #m{align-items:center;padding:28px}
 .sheet{max-width:780px;max-height:88vh;border-radius:18px;padding:22px 26px;animation:none}
 .sheet::before{display:none}
 #toast{left:calc(50% + var(--sw) / 2)}
}
@media (min-width:1500px){header .in,main{max-width:1320px}}
.utch{margin:12px 0 4px;padding:12px 12px 6px;border:1px solid var(--bd);border-radius:12px;background:linear-gradient(135deg,var(--card),var(--cardb))}
.utch h3{margin:0 0 2px;font-size:19px}.utlg{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;color:var(--mu);margin:2px 0 6px}.utlg i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.utsv{overflow-x:auto}.utsv svg{display:block;width:100%;height:auto}
/* ===== Historial de ventas y Utilidad ===== */
.pchips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 4px}
.pchips button{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600}
.pchips button.on{background:var(--gb);color:#fff;border-color:transparent}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 8px}.fgrid label{margin-top:6px}.fgrid .fw{grid-column:1/-1}
@media (min-width:1024px){.fgrid{grid-template-columns:2fr 1fr 1fr 1fr 1fr}.fgrid .fw{grid-column:auto}}
.hvres{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline;margin:10px 2px 2px}.hvres b{font:700 20px "Barlow Condensed","Arial Narrow",sans-serif}
.dgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 8px}.dgrid label{margin-top:6px}.dgrid label:first-child{grid-column:1/-1}
@media (min-width:700px){.dgrid{grid-template-columns:repeat(3,1fr)}.dgrid label:first-child{grid-column:auto}}
.fgrid input,.fgrid select,.dgrid input{min-width:0;max-width:100%}
.ut-big{color:var(--ok)}.ut-neg{color:var(--bad)}
.tb td.n,.tb th.n{text-align:right}

/* ===== Ventas en tránsito: barra para cambiar y submenú ===== */
.trbar{display:flex;gap:6px;overflow-x:auto;align-items:center;padding:2px 0 8px;margin:0 0 4px;border-bottom:1px solid var(--bd)}
.trbar>span{white-space:nowrap;font-size:13px;color:var(--mu);flex:none}

/* ---- Aportes de la empresa (TSS), costo laboral, volantes e historial ---- */
const TSS_DEF={sfsE:7.09,afpE:7.10,srl:1.10,inf:1,tpS:232230,tpA:464460,tpR:92892,hx:0};
const tssP=p=>Object.assign({},TSS_DEF,(S.cfg&&S.cfg.tss)||{},(p&&p.tss)||{});
function empCalc(b,he,tp){const base=b+(tp.hx?he:0),cS=Math.min(base,tp.tpS),cA=Math.min(base,tp.tpA),cR=Math.min(base,tp.tpR);return{sfs:cS*tp.sfsE/100,afp:cA*tp.afpE/100,srl:cR*tp.srl/100,inf:b*tp.inf/100}}
function rowE(p,r){const tp=tssP(p),b=+r.bruto||0,he=+r.he||0;let a,c2,d;if(r.eSfs!=null&&r.eAfp!=null&&r.eSrl!=null){a=+r.eSfs;c2=+r.eAfp;d=+r.eSrl}else{const E=empCalc(b,he,tp);a=rd2(E.sfs);c2=rd2(E.afp);d=rd2(E.srl)}const f=rd2(b*tp.inf/100);return{...r,eSfs:a,eAfp:c2,eSrl:d,eInf:f,eTot:rd2(a+c2+d+f),costo:rd2(b+he+a+c2+d+f)}}

function chg(k,o,n,docChanged){const p=[],d=(l,a,b,f)=>{if(a!==b)p.push(l+' '+(f?f(a):a)+' → '+(f?f(b):b))};
  if(['sales','quotes','orders','transit'].includes(k)){d('estado',o.status,n.status);if(Math.abs((+o.total||0)-(+n.total||0))>.004)d('total',o.total,n.total,money);if(!p.length&&JSON.stringify(o.lines)!=JSON.stringify(n.lines))p.push('cambió los productos');return p.join(', ')||'modificó'}
  if(k=='products'){d('nombre',o.name,n.name);d('precio',+o.price||0,+n.price||0,money);d('costo',+o.cost||0,+n.cost||0,money);d('precio al por mayor',+o.wprice||0,+n.wprice||0,money);d('mínimo',+o.min||0,+n.min||0);if(!docChanged)d('existencia',+o.stock||0,+n.stock||0);return p.join(', ')}
  if(k=='cxc'||k=='cxp'){const a=(o.pays||[]).length,b=(n.pays||[]).length;if(b>a){const l=n.pays[b-1];return 'abono de '+money(l.a)}if(Math.abs((+o.amount||0)-(+n.amount||0))>.004)d('monto',o.amount,n.amount,money);return p.join(', ')||'modificó'}
  return 'modificó'}
function auditDiff(){if(!usersOn()||!ME)return;if(!AUD.base){auditBase();return}
  const adds=[],dels=[],mods=[],cur={};AK.forEach(k=>{const m=new Map(),b=AUD.base[k]||new Map();(S[k]||[]).forEach(x=>{if(!x||x.id==null)return;if(!b.has(x.id)){if(BYK.includes(k)&&!x.by)x.by=ME.name;adds.push([k,x])}const s=JSON.stringify(x);m.set(x.id,s);if(b.has(x.id)&&b.get(x.id)!==s)mods.push([k,JSON.parse(b.get(x.id)),x])});b.forEach((s,id)=>{if(!m.has(id))dels.push([k,JSON.parse(s)])});cur[k]=m});
  const docCh=[...adds,...dels,...mods].some(a=>['sales','quotes','orders'].includes(a[0])),out=[],grp={},push=(k,op,x,det)=>{const g=k+'|'+op;(grp[g]=grp[g]||[]).push({k,op,x,det})};
  adds.forEach(a=>push(a[0],'add',a[1]));dels.forEach(a=>push(a[0],'del',a[1]));mods.forEach(a=>{const dt=chg(a[0],a[1],a[2],docCh);if(dt)push(a[0],'mod',a[2],dt)});
  Object.values(grp).forEach(L=>{const k=L[0].k,op=L[0].op,verb={add:'Creó',del:'Eliminó',mod:'Modificó'}[op];if(L.length>5&&op!='mod')out.push([k,op,verb+' '+L.length+' registros de '+ANM[k]+': '+L.slice(0,3).map(z=>labelOf(k,z.x)).join('; ')+'…']);else L.forEach(z=>out.push([k,op,verb+' '+ANM[k]+': '+labelOf(k,z.x)+(z.det&&op=='mod'?' ('+z.det+')':'')]))});

var RSP_READY=0,RSP_BUSY=0,RSP_L=[];const RSP_H=5,RSP_MAX=10,RSPW={exit:'Al salir',auto:'Automático (cada 5 horas)',man:'Hecho a mano'};
const rspLast=()=>{try{return +localStorage.getItem('ferre_abt')||0}catch(e){return 0}};

const rspReq=r=>new Promise((ok,no)=>{r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});
function rspDB(){return new Promise((ok,no)=>{try{const r=indexedDB.open('limoncito-respaldos',1);r.onupgradeneeded=()=>{const d=r.result;d.createObjectStore('idx',{keyPath:'ts'});d.createObjectStore('data',{keyPath:'ts'})};r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)}catch(e){no(e)}})}
async function rspLocalIdx(){const d=await rspDB();return (await rspReq(d.transaction('idx').objectStore('idx').getAll())).sort((a,b)=>b.ts-a.ts)}
async function rspLocalPut(ts,why,s){const d=await rspDB();await new Promise((ok,no)=>{const tx=d.transaction(['idx','data'],'readwrite');tx.objectStore('idx').put({ts,why,size:s.length});tx.objectStore('data').put({ts,s});tx.oncomplete=ok;tx.onerror=tx.onabort=()=>no(tx.error)});
  const L=await rspLocalIdx();if(L.length>RSP_MAX){const tx=d.transaction(['idx','data'],'readwrite');L.slice(RSP_MAX).forEach(o=>{tx.objectStore('idx').delete(o.ts);tx.objectStore('data').delete(o.ts)})}}
async function rspLocalGet(ts){const d=await rspDB();const r=await rspReq(d.transaction('data').objectStore('data').get(ts));if(!r)throw 0;return r.s}
const rspCloud=()=>!!(DB&&typeof DB.doc=='function');
async function rspCloudIdx(){const d=await DB.doc('ab_idx').get();return d.exists?(d.data().list||[]):[]}
async function rspCloudPut(ts,why,s){const Z=100000,n=Math.max(1,Math.ceil(s.length/Z));for(let i=0;i<n;i++)await DB.doc('ab_'+ts+'_'+i).set({p:s.slice(i*Z,(i+1)*Z)});
  let L=await rspCloudIdx();L.push({ts,why,size:s.length,n});L.sort((a,b)=>b.ts-a.ts);const old=L.slice(RSP_MAX);await DB.doc('ab_idx').set({list:L.slice(0,RSP_MAX)});
  for(const o of old)for(let i=0;i<o.n;i++){try{await DB.doc('ab_'+o.ts+'_'+i).delete()}catch(e){}}}
async function rspCloudGet(o){let s='';for(let i=0;i<o.n;i++){const c=await DB.doc('ab_'+o.ts+'_'+i).get();if(!c.exists)throw 0;s+=c.data().p}return s}
async function rspRun(why){if(RSP_BUSY||!rspHas())return 0;RSP_BUSY=1;try{const ts=Date.now(),s=rspData();let n=0;
  try{await rspLocalPut(ts,why,s);n++}catch(e){}
  if(rspCloud()){try{await rspCloudPut(ts,why,s);n++}catch(e){}}
  if(!n){try{localStorage.setItem('ferre_ab',JSON.stringify({ts,why,s}));n++}catch(e){}}
  if(!n)return 0;try{localStorage.setItem('ferre_abt',ts)}catch(e){}sfDraw();return ts}finally{RSP_BUSY=0}}

function kpiAna(D){const r=D.raw,A=[],add=(t,p,s)=>A.push({t,p,s:s||''}),m=money,f2=v=>v.toFixed(2),fp=v=>v.toFixed(1)+'%';
  if(!r.ta&&!r.tp&&!r.pat&&!(r.inc>0))return anaPack([],['Registra el balance general y los ingresos y costos de Contabilidad (Utilidad bruta y Gastos) para obtener el análisis.']);
  if(r.inc>0||r.exp>0)add('Base del análisis',`Del estado de resultados de ${D.sub}: ingresos por ventas ${m(r.inc)}, costo de ventas ${m(r.cost)}, gastos ${m(r.exp)}, utilidad bruta ${m(r.gb)} y utilidad neta ${m(r.net)}. Del balance general: activos ${m(r.ta)}, pasivos ${m(r.tp)} y capital ${m(r.pat)}.`);

  else add('Liquidez',`Tu liquidez corriente es ${f2(r.liq)}: por cada RD$ 1.00 que debes a corto plazo tienes RD$ ${f2(r.liq)} en activos corrientes. `+(r.liq>=1.5?'Cubres tus obligaciones inmediatas con holgura.':r.liq>=1?'Cubres tus deudas, pero con poco margen: vigila los cobros y el inventario.':'Tus activos corrientes no alcanzan para pagar la deuda a corto plazo: prioriza cobrar, vender inventario o renegociar plazos.')+(r.acid!=null?` Sin contar el inventario la razón baja a ${f2(r.acid)}`+(r.acid<1?', lo que muestra que dependes de vender mercancía para pagar.':', todavía saludable.'):''),r.liq>=1.5?'ok':r.liq>=1?'warn':'bad');
  if(r.cr!=null)add('Efectivo disponible',`Tu efectivo y bancos equivalen a ${f2(r.cr)} veces tu deuda a corto plazo. `+(r.cr>=.3?'Tienes caja suficiente para responder a imprevistos.':r.cr>=.1?'La caja es justa para tus compromisos inmediatos.':'La caja es muy baja frente a tus deudas inmediatas.'),r.cr>=.3?'ok':r.cr>=.1?'warn':'bad');
  if(r.en!=null)add('Endeudamiento y capital',`El ${fp(r.en)} de tus activos está financiado con deuda y el ${fp(r.eq)} con capital propio. `+(r.en<=50?'Estructura sólida y poco dependiente de terceros.':r.en<=70?'Nivel moderado: cuida no aumentar más la deuda.':'Nivel alto: dependes mucho de deuda; conviene reducirla.')+(r.cp!=null?` El ${fp(r.cp)} de tu deuda vence a corto plazo.`:''),r.en<=50?'ok':r.en<=70?'warn':'bad');
